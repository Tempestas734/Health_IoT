{% extends "kiosk/base.html" %}
{% block content %}
<div class="w-full max-w-[760px] bg-white dark:bg-zinc-900 rounded-[28px] shadow-[0_24px_60px_rgba(84,48,156,0.12)] p-6 md:p-10 flex flex-col">
  <div class="text-center mb-6">
    <p class="text-xs font-bold uppercase tracking-[0.24em] text-primary">Patient Session</p>
    <h1 class="mt-2 text-[#141019] dark:text-white text-3xl md:text-4xl font-black tracking-tight">Activate Session by PIN</h1>
    <p class="mt-2 text-[#6f5b8b] dark:text-zinc-400 text-sm md:text-base">Enter the prepared 6-digit PIN to activate a pending exam session on this device.</p>
  </div>

  <div class="rounded-[24px] border border-primary/10 bg-[linear-gradient(135deg,rgba(84,48,156,0.06),rgba(108,74,182,0.12))] p-5 md:p-6">
    <label for="session_pin" class="text-[11px] font-bold uppercase tracking-[0.22em] text-primary">Session PIN</label>
    <input id="session_pin" class="mt-3 w-full rounded-[20px] border border-primary/10 bg-white dark:bg-zinc-950 px-5 py-5 text-center text-[clamp(2.3rem,6vw,3.8rem)] tracking-[0.45em] font-black text-[#1c1726] dark:text-white focus:outline-none" inputmode="numeric" maxlength="6" type="text" value=""/>

    <label class="mt-5 flex items-center gap-3 cursor-pointer rounded-[18px] border border-primary/10 bg-white/80 dark:bg-zinc-950/70 px-4 py-4">
      <input id="agree" class="h-5 w-5 rounded border-zinc-300 text-primary focus:ring-primary" type="checkbox"/>
      <span class="text-sm font-semibold text-[#1c1726] dark:text-zinc-200">I accept the medical consent and privacy terms</span>
    </label>

    <input id="device_id" value="DEV-PI-001" type="hidden"/>
  </div>

  <div
    id="msg"
    class="{% if service_error %}flex{% else %}hidden{% endif %} mt-4 items-start gap-3 rounded-[18px] border border-red-200 bg-red-50 px-4 py-4 text-left text-sm text-red-700 shadow-sm dark:border-red-900/40 dark:bg-red-950/20 dark:text-red-200"
    role="alert"
    aria-live="assertive"
  >
    <span class="material-symbols-outlined mt-0.5 text-base">error</span>
    <div class="min-w-0">
      <p class="font-bold uppercase tracking-[0.12em] text-[11px]">Session Error</p>
      <p id="msg_text" class="mt-1">{{ service_error|default:"" }}</p>
    </div>
  </div>

  <div class="mt-6">
    <button id="start_button" class="w-full py-4 custom-gradient-bg text-white rounded-full font-bold text-lg shadow-lg hover:shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed" onclick="startPatientSession()" type="button">
      Activate Session
      <span class="material-symbols-outlined">arrow_forward</span>
    </button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function setMessage(message) {
  const msg = document.getElementById("msg");
  const msgText = document.getElementById("msg_text");
  if (!message) {
    msg.classList.add("hidden");
    msg.classList.remove("flex");
    msgText.textContent = "";
    return;
  }
  msg.classList.remove("hidden");
  msg.classList.add("flex");
  msgText.textContent = message;
}

async function startPatientSession() {
  const sessionPin = document.getElementById("session_pin").value.trim();
  const agree = document.getElementById("agree").checked;
  const deviceId = document.getElementById("device_id").value.trim();
  const button = document.getElementById("start_button");

  if (!/^\d{6}$/.test(sessionPin)) {
    setMessage("Please enter a valid 6-digit session PIN.");
    return;
  }

  if (!agree) {
    setMessage("Please accept the consent terms to continue.");
    return;
  }

  setMessage("");
  button.disabled = true;

  try {
    const res = await fetch("/api/session-activation/start-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        agree,
        session_pin: sessionPin,
        device_id: deviceId,
        terms_version: "v1",
        language: "fr"
      })
    });

    const payload = await res.json().catch(() => ({}));
    if (!res.ok) {
      let detail = payload.error || "";
      if (!detail && payload.errors) {
        const firstField = Object.keys(payload.errors)[0];
        const firstError = payload.errors[firstField]?.[0];
        detail = firstError?.message || "";
      }
      setMessage(detail || "Unable to activate the session.");
      return;
    }

    location.href = payload.next_path || "/guest";
  } catch (_) {
    setMessage("Service unavailable. Please try again.");
  } finally {
    button.disabled = false;
  }
}
</script>
{% endblock %}
